# Celery worker: маркира изтеклите резервации на всеки 30 с и обработва листата на чакащите.
# Само 1 реплика, защото -B пуска и графика (beat), а той трябва да върви само веднъж.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: event-booking:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "-B", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: event-booking-config
            - secretRef:
                name: event-booking-secret
