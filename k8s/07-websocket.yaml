# WebSocket server (daphne) for the live ticket count, on http://localhost:30081
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket
  template:
    metadata:
      labels:
        app: websocket
    spec:
      containers:
        - name: websocket
          image: event-booking:latest
          imagePullPolicy: IfNotPresent
          command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "config.asgi:application"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: event-booking-config
            - secretRef:
                name: event-booking-secret
---
apiVersion: v1
kind: Service
metadata:
  name: websocket
spec:
  type: NodePort
  selector:
    app: websocket
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30081
