# Django приложението: 2 pod-а, всеки пуска Gunicorn с 2 процеса x 4 нишки.
# Резервациите остават верни във всички pod-ове и нишки, защото заключването е в базата.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: event-booking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: event-booking-config
            - secretRef:
                name: event-booking-secret
          # Pod-ът получава трафик само когато началната страница отговаря (базата е горе и с миграции).
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              # Без това пробата праща IP-то на pod-а като host и Django
              # отговаря с 400, защото то не е в ALLOWED_HOSTS.
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
---
# Отваря приложението на http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
