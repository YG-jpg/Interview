# Settings that are the same for every Django pod
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-booking-config
data:
  DB_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  DEBUG: "0"
  WEBSOCKET_PORT: "30081"
---
# Passwords. In a real project these would not be in git.
apiVersion: v1
kind: Secret
metadata:
  name: event-booking-secret
type: Opaque
stringData:
  DB_NAME: events
  DB_USER: events
  DB_PASSWORD: events
  SECRET_KEY: change-me-in-production
  DJANGO_SUPERUSER_USERNAME: admin
  DJANGO_SUPERUSER_PASSWORD: admin
  DJANGO_SUPERUSER_EMAIL: admin@example.com
