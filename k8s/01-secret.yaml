# Passwords and keys. In a real project these would not be stored in git.
apiVersion: v1
kind: Secret
metadata:
  name: event-booking-secret
type: Opaque
stringData:
  DB_NAME: events
  DB_USER: events
  DB_PASSWORD: events
  SECRET_KEY: change-me-in-production
  DJANGO_SUPERUSER_USERNAME: admin
  DJANGO_SUPERUSER_PASSWORD: admin
  DJANGO_SUPERUSER_EMAIL: admin@example.com
