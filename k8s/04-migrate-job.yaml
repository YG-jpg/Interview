# Пуска се веднъж: създава таблиците и admin потребителя, после спира.
# Job е (а не част от web pod-овете), за да не пускат 2 web pod-а миграции едновременно.
# Ако Postgres още не е готов, Job-ът се проваля и Kubernetes просто опитва пак.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: event-booking:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python manage.py migrate && (python manage.py createsuperuser --noinput || true)"]
          envFrom:
            - configMapRef:
                name: event-booking-config
            - secretRef:
                name: event-booking-secret
