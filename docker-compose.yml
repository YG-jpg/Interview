# Run everything on your computer: docker compose up --build
services:
  db:
    image: postgres:17
    # the test with 100 threads opens 100+ connections (default limit is 100)
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "events"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7

  # Django website + API (Gunicorn, 2 processes x 4 threads)
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: dev.env
    command: >
      sh -c "python manage.py migrate &&
             (python manage.py createsuperuser --noinput || true) &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --reload"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Celery: background tasks (expire reservations, waiting list). -B also runs the scheduler.
  worker:
    build: .
    env_file: dev.env
    command: celery -A config worker -B --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - web

  # WebSocket server for the live ticket count
  websocket:
    build: .
    ports:
      - "8001:8001"
    env_file: dev.env
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    volumes:
      - .:/app
    depends_on:
      - web

volumes:
  db_data:
